<text x="5.90" y="27.20" font-family="sans-serif" font-size="2.0">13 (trim)</text>
<text x="62.40" y="22.00" font-family="sans-serif" font-size="2.0">SlabRail probe flag, 1:1 (check the 10 mm bar)</text>
<text x="62.40" y="25.40" font-family="sans-serif" font-size="2.0">1.0 mm aluminium sheet. Blank 24.4 x 55.25 mm.</text>
<text x="62.40" y="28.80" font-family="sans-serif" font-size="2.0">Dimensions from the BEND line and the dashed</text>
<text x="62.40" y="32.20" font-family="sans-serif" font-size="2.0">neck centre line (= hole centre line).</text>
<text x="62.40" y="35.60" font-family="sans-serif" font-size="2.0">1. Cut and file to the outline. The blade's top</text>
<text x="62.40" y="39.00" font-family="sans-serif" font-size="2.0">   edge is the trip edge: straight, square.</text>
<text x="62.40" y="42.40" font-family="sans-serif" font-size="2.0">2. This view shows the face that faces the buffer.</text>
<text x="62.40" y="45.80" font-family="sans-serif" font-size="2.0">   Neck in the vise, jaws at the BEND line; bend</text>
<text x="62.40" y="49.20" font-family="sans-serif" font-size="2.0">   the tab 90 deg TOWARD YOU (r ~1 mm). Bent the</text>
<text x="62.40" y="52.60" font-family="sans-serif" font-size="2.0">   other way the blade ends up on the wrong side.</text>
<text x="62.40" y="56.00" font-family="sans-serif" font-size="2.0">   Plate stays flat; check 90 deg with a square.</text>
<text x="62.40" y="59.40" font-family="sans-serif" font-size="2.0">3. THEN drill 5.2 mm on the centre line,</text>
<text x="62.40" y="62.80" font-family="sans-serif" font-size="2.0">   7.0 mm from the plate's inner face</text>
<text x="62.40" y="66.20" font-family="sans-serif" font-size="2.0">   (lands ~8.3 above the bend line flat).</text>
<text x="62.40" y="69.60" font-family="sans-serif" font-size="2.0">4. Trim the tab to 2 mm past the hole.</text>
<text x="62.40" y="73.00" font-family="sans-serif" font-size="2.0">5. Deburr. It rides in a 1.9 mm guide slot</text>
<text x="62.40" y="76.40" font-family="sans-serif" font-size="2.0">   and a 3.1 mm sensor slot.</text>
